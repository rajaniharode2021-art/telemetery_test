services:
  telemetry-app:
    build: .
    image: telemetry-app:latest
    container_name: telemetry-app
    init: true
    shm_size: "${SHM_SIZE:-64m}"
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${LOG_SERVER_PORT:-8080}:8080"
    environment:
      # Log server
      PORT: "${LOG_SERVER_PORT:-8080}"
      LOG_SERVER_DATA_DIR: "${LOG_SERVER_DATA_DIR:-/var/lib/log-server}"
      LOG_SERVER_503_PERCENT: "${LOG_SERVER_503_PERCENT:-5}"

      # Simulated MCU/shared memory
      TELEMETRY_SHM_PATH: "${TELEMETRY_SHM_PATH:-/dev/shm/data}"
      TELEMETRY_PACKET_SIZE: "${TELEMETRY_PACKET_SIZE:-26}"
      MCU_DROP_PERCENT: "${MCU_DROP_PERCENT:-5}"
      MCU_WRITE_INTERVAL_SECONDS: "${MCU_WRITE_INTERVAL_SECONDS:-0.1}"
    restart: unless-stopped
