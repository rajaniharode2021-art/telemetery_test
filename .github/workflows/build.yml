name: Test CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── native build + unit tests ─────────────────────────────────────────────
  build-and-test:
    name: Build & unit test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build
        run: make

      - name: Run unit tests
        run: make test

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: telemetry_forwarder
          path: telemetry_forwarder

  # ── Docker build + integration smoke test ────────────────────────────────
  docker-integration:
    name: Docker integration test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

      - name: Start container in background
        run: |
          docker compose up -d
          # Wait for all services to initialise
          sleep 15

      - name: Check MQTT telemetry is being published
        run: |
          # Subscribe for 5 seconds and capture at least one message
          timeout 5 docker exec telemetry-app \
            mosquitto_sub -h localhost -p 1883 -t '/vehicle/telemetry' -C 1 \
            | python3 -c "
          import sys, json
          data = sys.stdin.read().strip()
          print('received:', data[:200])
          obj = json.loads(data)
          assert 'magic' in obj,   'missing magic field'
          assert 'seq'   in obj,   'missing seq field'
          assert 'speed' in obj,   'missing speed field'
          assert obj['magic'] == 57005, f'wrong magic: {obj[\"magic\"]}'
          print('MQTT message OK')
          "

      - name: Check log server received entries
        run: |
          sleep 5
          docker exec telemetry-app \
            curl -sf http://localhost:8080/batch \
            | python3 -c "
          import sys, json
          entries = json.loads(sys.stdin.read())
          print(f'log entries received: {len(entries)}')
          assert len(entries) > 0, 'no log entries found'
          for e in entries[:3]:
              assert 'message'   in e, 'missing message field'
              assert 'timestamp' in e, 'missing timestamp field'
              print(' -', e['message'])
          print('Log server OK')
          "

      - name: Verify JSON field completeness
        run: |
          msg=$(timeout 5 docker exec telemetry-app \
            mosquitto_sub -h localhost -p 1883 -t '/vehicle/telemetry' -C 1)
          python3 -c "
          import json, sys
          obj = json.loads('$msg'.strip())
          required = ['magic','seq','timestamp','speed','batt_volt','fault','software_version']
          missing = [f for f in required if f not in obj]
          if missing:
              print('FAIL missing fields:', missing); sys.exit(1)
          print('All required fields present:', list(obj.keys()))
          "

      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop container
        if: always()
        run: docker compose down
