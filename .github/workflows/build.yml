name: Telemetry CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:

  # ─────────────────────────────────────────────
  # CI: Build & Integration Test (Docker-based)
  # ─────────────────────────────────────────────
  ci:
    name: CI - Build & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to initialize
        run: sleep 15

      # ─────────────────────────────
      # MQTT validation
      # ─────────────────────────────
      - name: Validate MQTT telemetry output
        run: |
          cat > /tmp/validate_mqtt.py << 'PYEOF'
          import json, sys
          obj = json.loads(sys.stdin.read())
          required = ['magic','seq','timestamp','speed','batt_volt','fault','software_version']
          missing = [f for f in required if f not in obj]
          if missing:
              print('Missing fields:', missing)
              sys.exit(1)
          assert obj['magic'] == 57005, 'Invalid magic value'
          print('MQTT validation OK')
          PYEOF

          msg=$(timeout 5 docker exec telemetry-app \
            mosquitto_sub -h localhost -p 1883 -t '/vehicle/telemetry' -C 1)
          echo "$msg"
          echo "$msg" | python3 /tmp/validate_mqtt.py

      # ─────────────────────────────
      # Log server validation
      # ─────────────────────────────
      - name: Validate log server output
        run: |
          cat > /tmp/validate_logs.py << 'PYEOF'
          import json, sys
          entries = json.loads(sys.stdin.read())
          print('log count:', len(entries))
          if len(entries) == 0:
              raise Exception('No logs received')
          for e in entries[:5]:
              assert 'message' in e
              assert 'timestamp' in e
          print('Log server validation OK')
          PYEOF

          sleep 5
          entries=$(docker exec telemetry-app curl -sf http://localhost:8080/batch)
          echo "$entries" | python3 /tmp/validate_logs.py

      # ─────────────────────────────
      # Cleanup
      # ─────────────────────────────
      - name: Stop services
        if: always()
        run: docker compose down


  # ─────────────────────────────────────────────
  # CD: Build & Push Docker Image
  # ─────────────────────────────────────────────
  cd:
    name: CD - Docker Image Publish
    runs-on: ubuntu-latest
    needs: ci
    # Only push on main/master, not on PRs
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build image
        run: docker build -t telemetry-app:latest .

      - name: Tag image
        run: docker tag telemetry-app:latest ${{ secrets.DOCKER_USER }}/telemetry-app:latest

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USER }}/telemetry-app:latest